<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="%BASE_URL%images/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./src/styles/base.css">
  <title>Hoje · Hábitos</title>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-brand-ice font-sans md:flex-row">
  <div id="menu"></div>

  <main id="pagina-habitos" class="flex-1 overflow-y-auto p-4 pb-24 sm:p-6 sm:pb-24 md:pb-6">
    <div class="mx-auto flex w-full max-w-2xl flex-col gap-4">

      <!-- Cabeçalho + data + botão -->
      <header class="flex flex-col items-stretch gap-4 sm:flex-row sm:items-start sm:justify-between">
        <div>
          <h1 class="text-3xl font-bold tracking-tight">Hoje</h1>
          <p id="data-hoje" class="mt-1 text-base text-brand-light-gray"></p>
        </div>
        <button
          type="button"
          id="btn-novo-habito"
          class="inline-flex shrink-0 cursor-pointer items-center justify-center gap-2 whitespace-nowrap rounded-2xl bg-brand-blue px-5 py-3 text-base font-semibold text-white transition-colors hover:bg-(--azul-escuro) active:scale-[.98]"
        >
          <svg class="size-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Novo hábito
        </button>
      </header>

      <!-- Progresso do dia -->
      <section class="rounded-2xl bg-brand-dark px-5 pt-5 pb-6 text-white" aria-labelledby="progresso-rotulo">
        <p id="progresso-rotulo" class="mb-1.5 text-base text-(--trilho)">Progresso de hoje</p>
        <p id="progresso-texto" class="mb-4 text-3xl font-bold tracking-tight" aria-live="polite">0 de 0 feitos</p>
        <div
          id="progresso-trilho"
          class="h-2 overflow-hidden rounded-full bg-brand-light-gray"
          role="progressbar"
          aria-labelledby="progresso-rotulo"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="progresso-barra" class="h-full w-0 rounded-full bg-(--lima) transition-[width] duration-300"></div>
        </div>
      </section>

      <!-- Contêiner da lista -->
      <section id="cartao-lista" class="overflow-hidden rounded-2xl bg-white" aria-label="Hábitos de hoje" hidden>
        <ul id="lista-habitos"></ul>
      </section>

      <!-- Estado vazio (nenhum hábito cadastrado) -->
      <section id="estado-vazio" class="rounded-2xl bg-white px-6 py-12 text-center" hidden>
        <div class="mx-auto mb-4 grid size-16 place-items-center rounded-full bg-(--lima-suave)">
          <svg class="size-7.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <h2 class="mb-2 text-xl font-bold">Nenhum hábito ainda</h2>
        <p class="mx-auto mb-5 max-w-sm text-base leading-normal text-brand-light-gray">Crie o seu primeiro hábito e comece a construir uma sequência.</p>
        <button
          type="button"
          id="btn-novo-habito-vazio"
          class="inline-flex cursor-pointer items-center justify-center gap-2 whitespace-nowrap rounded-2xl bg-brand-blue px-5 py-3 text-base font-semibold text-white transition-colors hover:bg-(--azul-escuro) active:scale-[.98]"
        >
          <svg class="size-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Novo hábito
        </button>
      </section>

      <!-- Hábitos que não são de hoje -->
      <section id="secao-nao-hoje" class="mt-3" hidden>
        <button
          type="button"
          id="nao-hoje-toggle"
          class="group flex w-full cursor-pointer items-center justify-between rounded-xl px-3 py-2 text-base font-semibold text-brand-light-gray"
          aria-expanded="true"
          aria-controls="lista-nao-hoje"
        >
          <span id="nao-hoje-titulo">Não é hoje (0)</span>
          <svg class="size-4.5 transition-transform duration-200 group-aria-[expanded=false]:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
        </button>
        <div id="lista-nao-hoje" class="mt-2.5 overflow-hidden rounded-2xl bg-white"></div>
      </section>

      <!-- As janelas (modais) de criar/editar e de confirmar exclusão são criadas pelo JavaScript -->
    </div>
  </main>

  <script type="module" src="./src/pages/habitos.js"></script>
</body>
</html>
