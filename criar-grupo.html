<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="%BASE_URL%images/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./src/styles/base.css">
  <title>Criar Grupo - Habit Tracker</title>
</head>
<body class="flex h-screen overflow-hidden bg-bg font-sans">
  <div id="menu" class="hidden shrink-0 md:block"></div>
  <main id="app" class="no-scrollbar min-w-0 flex-1 overflow-y-auto">
    <div class="layout-com-painel">
      <div id="conteudo" class="layout-com-painel__conteudo pb-28 md:pb-16">
        <div id="cabecalho"></div>

        <form id="form-grupo" class="mt-5 space-y-6" novalidate>
          <div id="resumo-erros"></div>

          <div class="space-y-1.5">
            <div class="flex items-baseline justify-between">
              <label for="nome-grupo" class="text-[15px] font-medium">Nome do grupo</label>
            </div>
            <input id="nome-grupo" type="text" class="w-full min-h-[48px] rounded-[10px] border border-line bg-surface px-3.5 text-[17px] text-ink placeholder:text-[#8a8a86] focus:border-action focus:outline-2 focus:outline-offset-0 focus:outline-action/30" placeholder="Ex.: Movimento 30 Dias">
          </div>

          <fieldset>
            <legend class="mb-2 text-[15px] font-medium">Categoria</legend>
            <div id="grade-categorias"></div>
          </fieldset>

          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-1.5">
              <div class="flex items-baseline justify-between">
                <label for="inicio" class="text-[15px] font-medium">Início</label>
              </div>
              <input id="inicio" type="date" class="w-full min-h-[48px] rounded-[10px] border border-line bg-surface px-3.5 text-[17px] text-ink placeholder:text-[#8a8a86] focus:border-action focus:outline-2 focus:outline-offset-0 focus:outline-action/30">
            </div>
            <div class="space-y-1.5">
              <div class="flex items-baseline justify-between">
                <label for="fim" class="text-[15px] font-medium">Fim</label>
              </div>
              <input id="fim" type="date" class="w-full min-h-[48px] rounded-[10px] border border-line bg-surface px-3.5 text-[17px] text-ink placeholder:text-[#8a8a86] focus:border-action focus:outline-2 focus:outline-offset-0 focus:outline-action/30">
            </div>
          </div>

          <div class="space-y-1.5">
            <div class="flex items-baseline justify-between">
              <label for="descricao" class="text-[15px] font-medium">Descrição (opcional)</label>
            </div>
            <textarea id="descricao" rows="3" class="w-full min-h-[48px] rounded-[10px] border border-line bg-surface px-3.5 text-[17px] text-ink placeholder:text-[#8a8a86] focus:border-action focus:outline-2 focus:outline-offset-0 focus:outline-action/30 py-3 leading-6"></textarea>
          </div>

          <fieldset>
            <legend class="mb-2 text-[15px] font-medium">Atividades e pontos</legend>
            <ul id="lista-atividades" class="space-y-2"></ul>
            <div id="erro-atividades"></div>
            <button id="adicionar-atividade" type="button" class="press inline-flex items-center justify-center gap-2 rounded-[12px] font-semibold disabled:cursor-not-allowed disabled:opacity-45 text-action hover:bg-action-tint mt-2 min-h-11 w-full px-5 text-[16px]">Adicionar atividade</button>
          </fieldset>

          <button type="submit" class="press inline-flex items-center justify-center gap-2 rounded-[12px] font-semibold disabled:cursor-not-allowed disabled:opacity-45 bg-action text-white hover:bg-action-press min-h-[50px] w-full px-5 text-[16px]">Criar grupo</button>
        </form>
      </div>
      <!-- Painel lateral "Hábitos de hoje" (só em telas grandes) -->
      <aside id="painel-habitos" class="layout-com-painel__lateral"></aside>
    </div>
  </main>
  <script type="module" src="/src/pages/criar-grupo.js"></script>
  <script type="module" src="/src/pages/painel-habitos.js"></script>
</body>
</html>
