<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feed - Habit Tracker</title>
    <script type="module" crossorigin src="/habit-tracker/assets/feed-D2MRItbi.js"></script>
    <link rel="modulepreload" crossorigin href="/habit-tracker/assets/auth-CYePSG_H.js">
    <link rel="modulepreload" crossorigin href="/habit-tracker/assets/auth-DaR7_4ld.js">
    <link rel="modulepreload" crossorigin href="/habit-tracker/assets/habitos-BpAUezHv.js">
    <link rel="modulepreload" crossorigin href="/habit-tracker/assets/navbar-Cuu2FhBJ.js">
    <link rel="stylesheet" crossorigin href="/habit-tracker/assets/base-CdAtAdox.css">
  </head>
  <body class="flex flex-row h-screen bg-brand-ice font-sans overflow-hidden">
    <div id="menu"></div>
    <main id="app" class="flex-1 overflow-y-auto p-4">
      <div class="mx-auto w-full max-w-2xl flex flex-col gap-4">
        <header class="flex items-start justify-between gap-4">
          <div>
            <h1 class="text-3xl font-bold">Feed</h1>
            <p class="text-sm">
              O que está acontecendo nos hábitos de todo mundo.
            </p>
          </div>
          <button
            id="btn-nova-postagem"
            type="button"
            class="shrink-0 cursor-pointer rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-blue-700"
          >
            + Nova postagem
          </button>
        </header>

        <input
          id="campo-busca"
          type="search"
          aria-label="Buscar por nome de usuário"
          placeholder="Buscar por @usuário"
          class="w-full rounded-lg bg-black/5 px-4 py-2.5 text-sm placeholder:text-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-600"
        />

        <ul id="lista-postagens" class="flex flex-col gap-4"></ul>

        <p
          id="estado-vazio"
          hidden
          class="rounded-xl bg-white p-6 text-center text-sm text-gray-600"
        >
          Ainda não há postagens. Que tal ser a primeira pessoa a postar?
        </p>
      </div>
    </main>
  </body>
</html>
