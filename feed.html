<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feed - Habit Tracker</title>
  </head>
  <body class="flex flex-row h-screen bg-brand-ice font-sans overflow-hidden">
    <div id="menu"></div>
    <main id="app" class="flex-1 overflow-y-auto p-4">
      <div class="mx-auto w-full max-w-2xl flex flex-col gap-4">
        <header class="flex items-start justify-between gap-4">
          <div>
            <h1 class="text-3xl font-bold">Feed</h1>
            <p class="text-sm">
              O que está acontecendo nos hábitos de todo mundo.
            </p>
          </div>
          <button id="btn-nova-postagem" type="button">Nova postagem</button>
        </header>

        <input
          id="campo-busca"
          type="search"
          aria-label="Buscar por nome de usuário"
          placeholder="Buscar por @usuário"
        />

        <ul id="lista-postagens" class="flex flex-col gap-4"></ul>

        <p id="estado-vazio" hidden>
          Ainda não há postagens. Que tal ser a primeira pessoa a postar?
        </p>
      </div>
    </main>
    <script type="module" src="/src/pages/feed.js"></script>
  </body>
</html>
